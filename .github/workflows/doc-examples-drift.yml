name: Doc examples drift

# Scheduled only: never runs on pull requests, so it cannot block merges.
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Compare documented examples with the live API
        env:
          API_BASE_URL: ${{ vars.DOC_EXAMPLES_API_URL }}
        run: node scripts/verify-doc-examples.mjs
